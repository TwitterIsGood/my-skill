[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-replica-suite"
version = "0.1.0"
description = "Visual-to-sprites-to-interactive-UI skill runtime"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
qa = ["selenium>=4.20"]

[tool.setuptools.packages.find]
include = ["ui_pipeline*"]
